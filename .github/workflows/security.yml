name: Security

# CodeQL, Semgrep and npm audit, judged by security-report.mjs, and zizmor
# over the workflows. The publish workflow calls this one, so a release waits
# on it and carries the report it writes.
on:
  push:
    branches: [main]
  pull_request:
  # Daily, so rules and advisories published since the last change are
  # checked against the code as it stands.
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  revision:
    name: Resolve revision
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      tag: ${{ steps.revision.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag is a release only from Publish, which runs on vX.Y.Z tags.
      - id: revision
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a vX.Y.Z release tag' >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Pass only dependency data to the audit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-lockfile
          path: |
            package-lock.json
          include-hidden-files: true
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: revision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: security-results/codeql-${{ matrix.language }}
          upload: false
      - name: Reject findings or incomplete analysis
        run: node security-report.mjs sarif security-results/codeql-${{ matrix.language }}
      - name: Upload to GitHub code scanning
        if: ${{ !cancelled() && hashFiles(format('security-results/codeql-{0}/*.sarif', matrix.language)) != '' && needs.revision.outputs.tag == '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: security-results/codeql-${{ matrix.language }}
          category: codeql-${{ matrix.language }}
      - name: Retain analysis even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-codeql-${{ matrix.language }}
          path: security-results/
          if-no-files-found: error

  semgrep:
    name: Semgrep
    needs: revision
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Build the pinned Semgrep image
        run: docker build --quiet --tag semgrep-pinned .github/security/semgrep
      # The runner's user owns the checkout, so Semgrep runs as that user to
      # read it through git and to write results the next command can read.
      - name: Scan all findings and fail on scanner warnings
        run: |
          mkdir -p security-results/semgrep
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/src" --workdir /src semgrep-pinned \
            semgrep scan --config p/security-audit --config p/secrets --strict --disable-nosem --metrics off --disable-version-check --max-target-bytes 0 --json-output security-results/semgrep/semgrep.json --sarif-output security-results/semgrep/semgrep.sarif .
          node security-report.mjs semgrep security-results/semgrep
      - name: Upload to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('security-results/semgrep-reviewed/semgrep.sarif') != '' && needs.revision.outputs.tag == '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: security-results/semgrep-reviewed/semgrep.sarif
          category: semgrep
      - name: Retain analysis even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-semgrep
          path: security-results/
          if-no-files-found: error

  dependencies:
    name: Dependency audit
    needs: revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-lockfile
          path: audit
      # npm audit exits 1 when it reports any advisory. The Security report
      # judges each one against .github/security/npm-audit-exceptions.json,
      # reading installed versions from the lockfile kept beside the audit,
      # and fails on any it does not accept. Any other exit fails here.
      - name: Audit locked dependencies including development tools
        run: |
          mkdir -p security-results/dependencies
          node -e 'require("node:fs").writeFileSync("audit/package.json", JSON.stringify({name:"wicker-security-audit",version:"0.0.0"}))'
          status=0
          npm audit --prefix audit --ignore-scripts --package-lock-only --include=dev --audit-level=low --json > security-results/dependencies/npm-audit.json || status=$?
          cp audit/package-lock.json security-results/dependencies/package-lock.json
          [ "$status" -le 1 ] || exit "$status"
      - name: Retain audit even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-dependencies
          path: security-results/
          if-no-files-found: error

  # zizmor audits the workflows themselves: template injection, credential
  # persistence, over-broad permissions, dangerous triggers, and actions with
  # known advisories or impostor commits. Findings it should not raise are
  # turned off in .github/zizmor.yml or ignored inline, each with its reason;
  # anything else fails the job.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - name: Install zizmor
        run: python -m pip install --require-hashes -r .github/requirements/zizmor.txt

      # The token lets the online audits look up advisories and check that each
      # pinned SHA belongs to the action it names.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          zizmor --format sarif .github/workflows > zizmor.sarif || status=$?
          zizmor --format plain .github/workflows || true
          exit "$status"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  report:
    name: Security report
    if: ${{ !cancelled() }}
    needs: [revision, codeql, semgrep, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-*
          path: security-results
          merge-multiple: true
      - name: Write report and enforce the gate
        if: ${{ !cancelled() }}
        env:
          SCAN_SHA: ${{ needs.revision.outputs.sha }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
          SCAN_JOBS: ${{ toJSON(needs) }}
        run: node security-report.mjs report security-results
      - name: Retain report and raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: security-results/
          if-no-files-found: error

  security-passed:
    name: Security passed
    if: always()
    needs: [revision, codeql, semgrep, dependencies, zizmor, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
