version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release is adopted once it is a week old; a security update is not held back.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Keep editor API types aligned with engines.vscode; raise both deliberately.
      - dependency-name: '@types/vscode'
      # TypeScript 7 is outside typescript-eslint's supported peer range.
      - dependency-name: typescript
        versions: ['>=7.0.0 <8.0.0']
      # Node types track the supported toolchain, not the newest Node release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      development-tools:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
  # The ClamAV and Semgrep images, pinned by digest. ClamAV signatures and
  # Semgrep registry rules are fetched per run. YARA-X and YARA Forge are
  # release downloads no ecosystem here follows; update-yara-rules.yml
  # proposes those.
  - package-ecosystem: docker
    directories:
      - /.github/security/clamav
      - /.github/security/semgrep
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  # zizmor, which the Security workflow installs from a hash-locked file.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
