name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so signatures and advisories published since the last change are
  # checked against the code as it stands.
  schedule:
    - cron: '23 8 * * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional vX.Y.Z tag of a draft release to scan and attach reports before publishing'
        type: string

permissions:
  contents: read

jobs:
  revision:
    name: Resolve revision
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      tag: ${{ steps.revision.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
          persist-credentials: false
      - id: revision
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a vX.Y.Z release tag' >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Pass only dependency data to the audit job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lockfile
          path: package-lock.json
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: revision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: security-results/codeql-${{ matrix.language }}
          upload: false
      - name: Reject findings or incomplete analysis
        run: node security-report.mjs sarif security-results/codeql-${{ matrix.language }}
      - name: Upload to GitHub code scanning
        if: ${{ !cancelled() && hashFiles(format('security-results/codeql-{0}/*.sarif', matrix.language)) != '' && needs.revision.outputs.tag == '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security-results/codeql-${{ matrix.language }}
          category: codeql-${{ matrix.language }}
      - name: Retain analysis even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-codeql-${{ matrix.language }}
          path: security-results/
          if-no-files-found: error

  semgrep:
    name: Semgrep
    needs: revision
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      # Every package in Semgrep's tree is pinned with its hashes; one that does
      # not match is refused rather than installed.
      - run: python -m pip install --require-hashes --only-binary=:all: -r .github/security/requirements.txt
      - name: Scan all findings and fail on scanner warnings
        run: |
          mkdir -p security-results/semgrep
          semgrep scan --config p/security-audit --config p/secrets --strict --disable-nosem --metrics off --disable-version-check --max-target-bytes 0 --json-output security-results/semgrep/semgrep.json --sarif-output security-results/semgrep/semgrep.sarif .
          node security-report.mjs semgrep security-results/semgrep
      - name: Upload to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('security-results/semgrep-reviewed/semgrep.sarif') != '' && needs.revision.outputs.tag == '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security-results/semgrep-reviewed/semgrep.sarif
          category: semgrep
      - name: Retain analysis even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-semgrep
          path: security-results/
          if-no-files-found: error

  dependencies:
    name: Dependency audit
    needs: revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-lockfile
          path: audit
      - name: Audit locked dependencies including development tools
        run: |
          mkdir -p security-results/dependencies
          node -e 'require("node:fs").writeFileSync("audit/package.json", JSON.stringify({name:"wicker-security-audit",version:"0.0.0"}))'
          npm audit --prefix audit --ignore-scripts --package-lock-only --include=dev --audit-level=low --json > security-results/dependencies/npm-audit.json
      - name: Retain audit even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-dependencies
          path: security-results/
          if-no-files-found: error

  release-asset:
    name: Fetch release VSIX
    needs: revision
    if: ${{ needs.revision.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # A draft release and its assets are visible only with write access.
      contents: write
    steps:
      # This job executes no repository code with its release-write token.
      - name: Download the VSIX and match it to the digest GitHub recorded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern 'wicker-*.vsix' --dir release-vsix
          files=(release-vsix/*.vsix)
          test "${#files[@]}" -eq 1
          name=$(basename "${files[0]}")
          recorded=$(gh api "repos/$GH_REPO/releases?per_page=30" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .assets[] | select(.name == \"$name\") | .digest")
          actual="sha256:$(sha256sum "${files[0]}" | cut -d' ' -f1)"
          echo "$name recorded $recorded, downloaded $actual"
          test -n "$recorded" && test "$recorded" = "$actual"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-vsix
          path: release-vsix/
          if-no-files-found: error

  malware:
    name: Malware scan (ClamAV + YARA-X)
    needs: [revision, release-asset]
    if: ${{ !cancelled() && needs.revision.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.release-asset.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      # Installed exactly as locked, and scanned before any of it has run.
      - name: Install dependencies without running their scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the VSIX this commit would ship
        if: ${{ needs.revision.outputs.tag == '' }}
        run: |
          npm run build
          npm run vsix -w wicker
          mkdir -p .security-scan/vsix
          cp packages/vscode/dist/wicker-*.vsix .security-scan/vsix/
      - name: Take the VSIX the release ships
        if: ${{ needs.revision.outputs.tag != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-vsix
          path: .security-scan/vsix
      - name: Scan with ClamAV and YARA-X
        run: bash .github/security/malware-scan.sh security-results/malware
      - name: Reject detections and incomplete scans
        run: node security-report.mjs malware security-results/malware
      - name: Retain scan even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-malware
          path: security-results/
          if-no-files-found: error

  report:
    name: Security gate
    if: ${{ !cancelled() }}
    needs: [revision, codeql, semgrep, dependencies, release-asset, malware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: security-*
          path: security-results
          merge-multiple: true
      - name: Write report and enforce the gate
        if: ${{ !cancelled() }}
        env:
          SCAN_SHA: ${{ needs.revision.outputs.sha }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
          SCAN_JOBS: ${{ toJSON(needs) }}
        run: node security-report.mjs report security-results
      - name: Retain report and raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: security-results/
          if-no-files-found: error

  release-report:
    name: Attach release report
    if: ${{ !cancelled() && needs.revision.outputs.tag != '' }}
    needs: [revision, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job executes no repository code with its release-write token.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: security-results
      - name: Attach summary and complete scanner evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.revision.outputs.tag }}
        run: |
          test -s security-results/security-report.md
          test -s security-results/security-report.json
          tar -czf security-results.tar.gz -C security-results .
          gh release upload "$RELEASE_TAG" security-results/security-report.md security-results/security-report.json security-results.tar.gz --clobber
